<nav aria-label="Paginação"><span>Página {{ page.number }} de {{ page.paginator.num_pages }}</span>{% if page.has_previous %}<a href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}">Anterior</a>{% endif %}{% if page.has_next %}<a href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}">Próxima</a>{% endif %}</nav>
